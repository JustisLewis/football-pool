[project]
name = "football-pool"
version = "0.1.0"
description = "Track college football pool picks against the spread"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
]

[project.scripts]
fp = "football_pool.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_pool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
